name: Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      # GeneratePackageOnBuild is on, so this also writes the .nupkg.
      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      # The publish workflow pushes this exact, tested package.
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: src/Masterly.AssembliesScanner/bin/Release/*.nupkg
          if-no-files-found: error
          retention-days: 7
