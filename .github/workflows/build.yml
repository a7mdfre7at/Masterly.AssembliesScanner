name: Build

# Two jobs: build and test, and CodeQL (codeql-analysis.yml). The run succeeds only when both do, and the publish
# workflow publishes only after a successful run, so nothing reaches nuget.org without a passing CodeQL analysis.

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Monthly, so CodeQL picks up new queries on unchanged code. Publish ignores scheduled runs.
  schedule:
    - cron: '0 8 1 * *'

permissions:
  contents: read

concurrency:
  # The event is part of the group so the scheduled run never cancels a push build of master.
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      # GeneratePackageOnBuild is on, so this also writes the .nupkg.
      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      # The publish workflow pushes this exact, tested package.
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: src/Masterly.AssembliesScanner/bin/Release/*.nupkg
          if-no-files-found: error
          retention-days: 7

  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql-analysis.yml
    permissions:
      actions: read
      contents: read
      security-events: write
