name: Publish to NuGet

# Runs after every Build. It publishes only when the <Version> in the project file is not on nuget.org yet,
# then tags the commit v<version> and creates a GitHub release with CHANGELOG.md as its body.
#
# Publishing uses NuGet trusted publishing: GitHub's OIDC token is exchanged for a short-lived API key, so no
# long-lived key is stored in the repository. One-time setup:
#   1. On nuget.org, open your account > Trusted Publishing and add a GitHub Actions policy for
#      repository owner a7mdfre7at, repository Masterly.AssembliesScanner, workflow file publish.yml
#      and environment nuget.
#   2. The NUGET_API_KEY secret is no longer used and can be deleted.
# The login step names the nuget.org profile (a7mdfre7at) that owns the policy; it is public, so it is not a secret.

on:
  workflow_run:
    workflows: [ "Build" ]
    branches: [ master ]
    types: [ completed ]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to nuget.org
    # Only a successful Build of a push to master. A pull request from a fork's master branch also has
    # head_branch master, so the event must be checked too.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      actions: read     # download the package the Build run produced
      contents: write   # create the tag and the GitHub release
      id-token: write   # request the OIDC token for trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read the version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Masterly.AssembliesScanner/Masterly.AssembliesScanner.csproj | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::No <Version> found in the project file."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check nuget.org
        id: check
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          lower=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')
          if curl -fsS https://api.nuget.org/v3-flatcontainer/masterly.assembliesscanner/index.json | grep -q "\"$lower\""; then
            echo "Version $VERSION is already on nuget.org; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the tested package
        if: steps.check.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: nupkg
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Setup .NET
        if: steps.check.outputs.publish == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (trusted publishing)
        if: steps.check.outputs.publish == 'true'
        id: login
        uses: NuGet/login@v1
        with:
          user: a7mdfre7at

      - name: Push to nuget.org
        if: steps.check.outputs.publish == 'true'
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet nuget push "nupkg/Masterly.AssembliesScanner.$VERSION.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create the GitHub release
        if: steps.check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          body_path: CHANGELOG.md
          files: nupkg/*.nupkg
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          make_latest: ${{ !contains(steps.version.outputs.version, '-') }}
