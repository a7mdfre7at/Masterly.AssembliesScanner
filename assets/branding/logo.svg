<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Masterly.AssembliesScanner logo">
  <title>Masterly.AssembliesScanner</title>
  <defs>
    <linearGradient id="l-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="l-beam" x1="0" x2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A5F3FC"/>
      <stop offset="0.82" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="l-wake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="l-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="l-glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="l-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="l-tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#l-tile)">
    <rect width="512" height="512" fill="url(#l-bg)"/>
    <rect width="512" height="256" fill="url(#l-sheen)"/>
    <!-- the region the beam has already read -->
    <rect x="112" y="112" width="288" height="152" fill="url(#l-wake)"/>
  </g>
  <!-- viewfinder -->
  <g fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 178 V128 a28 28 0 0 1 28 -28 H178"/>
    <path d="M334 100 H384 a28 28 0 0 1 28 28 V178"/>
    <path d="M412 334 V384 a28 28 0 0 1 -28 28 H334"/>
    <path d="M178 412 H128 a28 28 0 0 1 -28 -28 V334"/>
  </g>
  <!-- the stack of assemblies: read above the beam, not yet below -->
  <g filter="url(#l-shadow)">
      <g opacity="1">
        <rect x="160" y="150" width="192" height="46" rx="14" fill="#FFFFFF"/>
        <circle cx="186" cy="173" r="8" fill="#1E1B4B" opacity="0.55"/>
        <rect x="208" y="168" width="96" height="10" rx="5" fill="#1E1B4B" opacity="0.32"/>
      </g>
      <g opacity="0.92">
        <rect x="160" y="216" width="192" height="46" rx="14" fill="#FFFFFF"/>
        <circle cx="186" cy="239" r="8" fill="#1E1B4B" opacity="0.55"/>
        <rect x="208" y="234" width="96" height="10" rx="5" fill="#1E1B4B" opacity="0.32"/>
      </g>
      <g opacity="0.38">
        <rect x="160" y="316" width="192" height="46" rx="14" fill="#FFFFFF"/>
        <circle cx="186" cy="339" r="8" fill="#1E1B4B" opacity="0.55"/>
        <rect x="208" y="334" width="72" height="10" rx="5" fill="#1E1B4B" opacity="0.32"/>
      </g>
  </g>
  <!-- scan beam -->
  <rect x="64" y="262" width="384" height="18" rx="9" fill="#22D3EE" filter="url(#l-glow)" opacity="0.9"/>
  <rect x="72" y="265" width="368" height="12" rx="6" fill="url(#l-beam)"/>
</svg>
